# to update: tmux source-file ~/.tmux.conf
set-option -g default-terminal 'xterm-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# speed up escape key
set -sg escape-time 0

# alert apps when they gain/lose focus
set-option -g focus-events on

# vi-style navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# split new pane to path of previous
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# clear session and pane name for renaming
bind-key '$' command-prompt "rename-session '%%'"
bind-key , command-prompt "rename-window '%%'"

set -g renumber-windows on  # renumber windows when a window is closed
set -g set-clipboard on     # use system clipboard
setw -g mode-keys vi        # vi keys to move around panes

bind-key x kill-pane  # skip confirmation for killing pane

# keep pane numbers visible until one is selected
bind -T prefix q display-panes -d 0

# color to replace classic tmux green
tmuxgreen="green"

# status bar
set -g status-left-length 100
set -g status-style "bg=${tmuxgreen},fg=black"
set -g window-status-current-format "#[underscore,bold]#I:#W#[default,bold]#{?window_zoomed_flag, ,}#[default]"
set -g window-status-format "#I:#W#{?window_zoomed_flag, ,}"
set -g status-left "   | #[bold]#S #[default]| "
set -g status-right "#[bold] #h"

# pane borders
set -g pane-active-border-style "fg=${tmuxgreen},bg=default"
set -g pane-border-style "fg=black,bg=default"
